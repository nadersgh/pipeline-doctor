[project]
name = "pipeline-doctor"
version = "0.1.0"
description = "An agent that diagnoses broken dbt/Airflow pipelines and proposes reviewed fixes."
readme = "README.md"
authors = [
    { name = "Nader Sghir", email = "sghir.nader@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10,<1.11",
    "dbt-duckdb>=1.9",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "loguru>=0.7.3",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.22.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
pipeline-doctor = "pipeline_doctor.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=1.13.0",
    "openai>=3.29.0",
]
snowflake = [
    "snowflake-connector-python>=4.8.0",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PL", "ANN"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S101", "RUF001", "PLR0911", "PLR0912", "ANN401", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR"]
# Diagnostic SQL is assembled from regex-validated identifiers and still passes the sqlglot guard before running.
"src/pipeline_doctor/diagnostics/checks.py" = ["S608"]
"src/pipeline_doctor/agent/reasoning/heuristic.py" = ["S608"]
"src/pipeline_doctor/warehouse/*_warehouse.py" = ["S608"]
# Fault injection SQL is static test-fixture data.
"src/pipeline_doctor/evals/cases.py" = ["S608"]
"src/pipeline_doctor/dbt_tools/artifacts.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs dbt against a real DuckDB demo workspace (slower)"]
